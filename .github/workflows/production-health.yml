name: Production health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTHCHECK_BASE_URL: https://respublica-ev.de
      HEALTHCHECK_OIDC_ISSUER: https://dev-z4e38ypuvs0ctrsf.eu.auth0.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Verify health, identity discovery, and protected boundaries
        run: node scripts/check-deployment-health.mjs
